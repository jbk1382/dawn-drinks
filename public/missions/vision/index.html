<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하늘이의 등굣길</title>
<style>
:root{--p:#2e7d5b;--pd:#1f5c42;--pl:#e8f5ee;--ink:#1d2321;--mut:#66706b;--bg:#eef2f0;--card:#fff;--line:#dfe6e2;--bad:#d9534f;--badl:#fdecea;--warn:#f2b632}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.phone{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--card);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.top{position:sticky;top:0;background:var(--card);padding:12px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.steps{display:flex;gap:6px}
.steps div{flex:1;font-size:11px;color:var(--mut);text-align:center}
.steps div i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:4px}
.steps div.on{color:var(--pd);font-weight:700}.steps div.on i{background:var(--p)}
.steps div.done i{background:#9fd0b6}
.screen{padding:20px 16px 28px;flex:1;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:4px 0 0;line-height:1.3}
h2{font-size:21px;margin:0;line-height:1.35}
h1:focus,h2:focus{outline:none}
p{margin:0;line-height:1.65}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--pd);background:var(--pl);padding:4px 10px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card.soft{background:var(--pl);border-color:transparent}
.fact{background:#fff8e6;border:1px solid #f6e2a8;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6}
.fact b{display:block;font-size:12px;color:#9a6b00;margin-bottom:2px}
.btn{appearance:none;border:none;border-radius:14px;background:var(--p);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:15px 18px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--pl);color:var(--pd)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.key:focus-visible,.opt:focus-visible,.spot:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.spacer{flex:1}
.hero{font-size:64px;text-align:center;line-height:1.1;margin-top:8px}
.row{display:flex;gap:10px;align-items:center}
label.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
label.tog input{width:22px;height:22px;accent-color:var(--p)}
/* stage 1 */
.field{background:#0c100f;border-radius:20px;min-height:250px;position:relative;color:#d7efe3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 14px 16px;overflow:hidden}
.fieldtop{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:14px;color:#9fb8ac}
.eye{font-size:44px;opacity:.9}
.sig{min-height:22px;font-size:14px;color:#8fe0b8;margin-top:10px;text-align:center}
.cap{min-height:48px;font-size:16px;font-weight:600;text-align:center;margin-top:6px;line-height:1.5}
.cap.flash{animation:fl .35s}
@keyframes fl{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
.field.bump{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.key{appearance:none;border:none;border-radius:14px;background:#24302b;color:#fff;font-size:26px;height:62px;cursor:pointer}
.key:active{background:var(--p)}
.cane{background:#f2b632;color:#3a2a00}
.cane small{font-weight:400;opacity:.7;font-size:13px}
.mapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:300px;margin:0 auto;width:100%}
.cell{aspect-ratio:1;border-radius:9px;background:#eef2f0;display:flex;align-items:center;justify-content:center;font-size:21px}
.cell.vis{background:#cfe9db}
.cell.hit{background:#f8d2cf;box-shadow:inset 0 0 0 2px var(--bad)}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--pl);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pd)}
.stat span{font-size:12px;color:var(--mut)}
/* stage 2 */
.scene{font-size:48px;text-align:center}
.bubble{background:#f3f5f4;border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:16px;line-height:1.55;position:relative}
.who{font-size:13px;font-weight:700;color:var(--pd);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;font-size:15px;line-height:1.5;cursor:pointer;color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--badl);color:#7a2e2b}
.opt.right{border-color:var(--p);background:var(--pl);color:var(--pd);font-weight:700}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.6}
.fb.bad{background:var(--badl);color:#7a2e2b}
.fb.good{background:var(--pl);color:var(--pd)}
/* stage 3 */
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.spot{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);min-height:112px;justify-content:center}
.spot .ic{font-size:38px}
.spot .nm{font-size:14px;font-weight:600;text-align:center}
.spot.fixed{border-color:var(--p);background:var(--pl)}
.spot.ok{border-color:#c9d7cf;background:#f7faf8}
.spot .st{font-size:12px;color:var(--pd);font-weight:700;min-height:16px}
.counter{font-size:15px;font-weight:700;color:var(--pd)}
.sheetbg{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 16px 26px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out;max-height:88dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sr{background:#13201a;color:#bff0d6;border-radius:12px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
/* finale */
ul.take{margin:0;padding-left:20px;line-height:1.8;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="phone"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
'use strict';
/* ───────────── 설정 · 앱 연동 ───────────── */
const params = new URLSearchParams(location.search);
const MISSION_ID = params.get('mission') || 'vision-2026';
const EMBEDDED = window.parent !== window || !!window.ReactNativeWebView;

// 미션 완료를 앱(부모 창)에 알림. 앱 쪽에서는 type === 'DAUN_MISSION_COMPLETE' 메시지를 받으면 주문 화면을 연다.
function reportComplete(){
  const msg = {
    type: 'DAUN_MISSION_COMPLETE',
    missionId: MISSION_ID,
    result: {
      durationSec: Math.round((Date.now() - S.startedAt) / 1000),
      bumpsWithoutTools: S.s1.bumpsA,
      bumpsWithTools: S.s1.bumpsB,
      quizFirstTry: S.s2.firstTry,
      quizTotal: SCENES.length,
      barriersFixed: S.s3.fixed.size
    }
  };
  try { if (window.parent !== window) window.parent.postMessage(msg, location.origin); } catch (e) {}
  try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {}
}

/* ───────────── 상태 ───────────── */
const S = { captions: true, startedAt: Date.now(), s1: { bumpsA: 0, bumpsB: 0, reachedA: false }, s2: { firstTry: 0 }, s3: { fixed: new Set() } };
let timers = [];
let R = null;      // 1단계 라운드 상태
let mode = 'intro';
const $app = document.getElementById('app');
const $live = document.getElementById('live');

function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; stopAmbient(); }
function render(html){
  $app.innerHTML = html;
  window.scrollTo(0, 0);
  const h = $app.querySelector('h1,h2');
  if (h){ h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}
function announce(t){ $live.textContent = ''; setTimeout(() => { $live.textContent = t; }, 30); }
function vibrate(ms){ try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch (e) {} }

/* ───────────── 소리 (Web Audio) ───────────── */
let AC = null, master = null, amb = null;
function audio(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function out(node, pan){
  if (AC.createStereoPanner){ const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0)); node.connect(p); p.connect(master); }
  else node.connect(master);
}
function tone({ freq = 440, dur = .15, type = 'sine', gain = .3, pan = 0, when = 0, slideTo = null }){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(gain, .0002), t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); out(g, pan); o.start(t); o.stop(t + dur + .05);
}
function noiseBuf(sec, decay){
  const len = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (decay ? 1 - i / len : 1);
  return b;
}
function noise({ dur = .1, gain = .2, freq = 1000, q = 1, pan = 0, when = 0, type = 'bandpass' }){
  const ac = audio(); if (!ac) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(dur, true);
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.value = gain;
  s.connect(f); f.connect(g); out(g, pan); s.start(ac.currentTime + when);
}
function startAmbient(){
  const ac = audio(); if (!ac || amb) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(2, false); s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 450;
  const g = ac.createGain(); g.gain.value = .07;
  s.connect(f); f.connect(g); g.connect(master); s.start(); amb = s;
}
function stopAmbient(){ if (amb){ try { amb.stop(); } catch (e) {} amb = null; } }
const SFX = {
  step(){ noise({ dur: .07, gain: .3, freq: 450, q: .8 }); },
  thud(){ tone({ freq: 95, slideTo: 45, dur: .25, gain: .7 }); noise({ dur: .12, gain: .35, freq: 220, type: 'lowpass' }); vibrate(120); },
  caneEmpty(pan, when){ tone({ freq: 2600, dur: .035, type: 'triangle', gain: .12, pan, when }); },
  caneHit(pan, when){ tone({ freq: 1250, dur: .05, type: 'square', gain: .2, pan, when }); tone({ freq: 1250, dur: .05, type: 'square', gain: .2, pan, when: when + .08 }); },
  signal(pan, g){ tone({ freq: 1050, dur: .11, type: 'square', gain: .32 * g, pan }); tone({ freq: 1050, dur: .11, type: 'square', gain: .32 * g, pan, when: .17 }); },
  good(){ [660, 880, 1175].forEach((f, i) => tone({ freq: f, dur: .2, gain: .2, when: i * .1 })); },
  soft(){ tone({ freq: 330, dur: .18, gain: .15 }); },
  fix(){ tone({ freq: 700, dur: .1, gain: .2 }); tone({ freq: 1050, dur: .2, gain: .2, when: .09 }); }
};

/* ───────────── 음성 (TTS) ───────────── */
let koVoice = null;
function loadVoices(){ try { koVoice = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate = 1.05){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = rate; if (koVoice) u.voice = koVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ───────────── 공통 UI ───────────── */
const STEP_NAMES = ['소리로 길찾기', '친구와 하루', '장벽 고치기'];
function hdr(n){
  return `<div class="top"><div class="steps" aria-label="진행 단계 ${n} / 3">${STEP_NAMES.map((t, i) =>
    `<div class="${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}"><i></i>${i + 1}. ${t}</div>`).join('')}</div></div>`;
}
function on(id, fn){ const el = document.getElementById(id); if (el) el.onclick = fn; }

/* ───────────── 0. 시작 ───────────── */
function intro(){
  mode = 'intro'; clearTimers();
  render(`
  <div class="screen">
    <div class="hero" aria-hidden="true">🧑‍🦯</div>
    <span class="tag" style="align-self:center">장애이해 미션 · 약 5분</span>
    <h1 style="text-align:center">하늘이의 등굣길</h1>
    <p style="text-align:center">하늘이는 앞이 보이지 않는 우리 학교 친구예요.<br>하늘이가 매일 <b>어떻게</b> 길을 찾고 생활하는지<br>같은 방법으로 직접 해 봐요.</p>
    <div class="card soft">
      <p style="font-size:15px">🎧 <b>이어폰을 끼면</b> 소리 방향을 더 잘 들을 수 있어요.<br>왼쪽 → 오른쪽 순서로 소리가 들리는지 확인해 보세요.</p>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="test">🔊 소리 테스트</button></div>
    </div>
    <label class="tog card">소리 자막 보기 <small class="mut">(소리를 글자로도 보여줘요)</small><input type="checkbox" id="capt" ${S.captions ? 'checked' : ''}></label>
    <div class="spacer"></div>
    <button class="btn" id="go">시작하기</button>
  </div>`);
  document.getElementById('capt').onchange = e => { S.captions = e.target.checked; };
  on('test', () => { SFX.signal(-1, 1); setTimeout(() => SFX.signal(1, 1), 700); announce('왼쪽, 그리고 오른쪽에서 신호음이 납니다'); });
  on('go', () => { audio(); S.startedAt = Date.now(); stage1Intro(); });
}

/* ───────────── 1. 소리로 길찾기 ───────────── */
const COLS = 5, ROWS = 6, START = [2, 5];
const MAPS = {
  A: { goal: [4, 0], time: 20,
       obs: [[2, 4], [1, 2], [3, 2], [4, 3], [0, 1], [3, 0]],
       items: ['🚲', '📦', '🪧', '🛴', '🪴', '🗑️'] },
  B: { goal: [0, 0],
       obs: [[2, 4], [1, 3], [0, 2], [3, 2], [2, 1]],
       items: ['🚲', '🛴', '🪧', '📦', '🪴'] }
};
function stage1Intro(){
  mode = 'text';
  render(`${hdr(1)}
  <div class="screen">
    <span class="tag">1단계</span>
    <h2>소리로 건너는 횡단보도</h2>
    <p>학교 앞 횡단보도 신호등까지 가야 해요.<br>하지만 화면은 <b>깜깜</b>해요.</p>
    <div class="card"><p style="font-size:15px">⬆️⬅️➡️⬇️ 버튼(또는 키보드 방향키)으로 한 칸씩 움직여요.<br>길에는 자전거, 입간판 같은 물건이 놓여 있어요.</p></div>
    <p class="mut">첫 번째는 아무 정보 없이 20초 동안 도전해요.</p>
    <div class="spacer"></div>
    <button class="btn" id="go">도전하기</button>
  </div>`);
  on('go', () => playRound('A'));
}
function cellKey(x, y){ return x + ',' + y; }
function obstacleAt(x, y){ return R.m.obs.findIndex(o => o[0] === x && o[1] === y); }
function blocked(x, y){ return x < 0 || x >= COLS || y < 0 || y >= ROWS || obstacleAt(x, y) >= 0; }
function caption(t){
  const el = document.getElementById('cap'); if (!el) return;
  el.textContent = S.captions ? t : '';
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function playRound(r){
  clearTimers(); mode = 'play';
  const m = MAPS[r];
  R = { r, m, pos: START.slice(), visited: new Set([cellKey(...START)]), hits: new Set(), bumps: 0, done: false, left: m.time || 0 };
  render(`${hdr(1)}
  <div class="screen">
    <h2>${r === 'A' ? '라운드 1 · 아무 정보 없이' : '라운드 2 · 흰지팡이 + 음향신호기'}</h2>
    <p class="mut">${r === 'A' ? '신호등이 어디 있는지 몰라요. 그래도 찾아가 보세요!' : '🦯 지팡이로 앞과 양옆을 살피고, 🔊 신호음이 나는 쪽으로 가세요.'}</p>
    <div class="field" id="field">
      <div class="fieldtop"><span>${r === 'A' ? `⏱ <b id="tm">${m.time}</b>초` : '🎧 소리를 따라가요'}</span><span>💥 부딪힘 <b id="bp">0</b></span></div>
      <div class="eye" aria-hidden="true">${r === 'A' ? '🌑' : '🔊'}</div>
      <div class="sig" id="sig" aria-hidden="true"></div>
      <div class="cap" id="cap" role="status"></div>
    </div>
    <div class="pad">
      <span></span><button class="key" data-mv="0,-1" aria-label="앞으로 한 칸">↑</button><span></span>
      <button class="key" data-mv="-1,0" aria-label="왼쪽으로 한 칸">←</button><button class="key" data-mv="0,1" aria-label="뒤로 한 칸">↓</button><button class="key" data-mv="1,0" aria-label="오른쪽으로 한 칸">→</button>
    </div>
    ${r === 'B' ? '<button class="btn cane" id="cane">🦯 지팡이로 살피기 <small>(스페이스바)</small></button>' : ''}
  </div>`);
  $app.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [dx, dy] = b.dataset.mv.split(',').map(Number); move(dx, dy); });
  on('cane', cane);
  startAmbient();
  if (r === 'A'){
    caption('깜깜해요… 어디로 가야 할까요?');
    timers.push(setInterval(() => {
      R.left--; const tm = document.getElementById('tm'); if (tm) tm.textContent = R.left;
      if (R.left <= 0) endRound(false);
    }, 1000));
  } else {
    caption('삐뽀삐뽀 신호음이 들리나요? 지팡이로 먼저 살펴보세요.');
    signalTick();
    timers.push(setInterval(signalTick, 1000));
  }
}
function signalTick(){
  if (!R || R.done || R.r !== 'B') return;
  const [x, y] = R.pos, [gx, gy] = R.m.goal, dx = gx - x, dist = Math.abs(dx) + Math.abs(gy - y);
  SFX.signal(Math.max(-1, Math.min(1, dx / 3)), Math.max(.3, 1 - dist * .11));
  const dir = dx < 0 ? '왼쪽 앞' : dx > 0 ? '오른쪽 앞' : '바로 앞';
  const far = dist <= 2 ? '아주 가까워요' : dist <= 4 ? '가까워요' : '멀어요';
  const sig = document.getElementById('sig'); if (sig) sig.textContent = S.captions ? `🔊 신호음 · ${dir} · ${far}` : '';
}
function move(dx, dy){
  if (!R || R.done) return;
  const [x, y] = R.pos, nx = x + dx, ny = y + dy;
  if (blocked(nx, ny)){
    R.bumps++; const oi = obstacleAt(nx, ny); if (oi >= 0) R.hits.add(oi);
    SFX.thud();
    const f = document.getElementById('field'); if (f){ f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
    document.getElementById('bp').textContent = R.bumps;

  }

function cane(){
  if (!R || R.done || R.r !== 'B') return;
  const [x, y] = R.pos;
  const dirs = [{ n: '왼쪽', d: [-1, 0], pan: -.85 }, { n: '앞', d: [0, -1], pan: 0 }, { n: '오른쪽', d: [1, 0], pan: .85 }];
  const res = dirs.map((o, i) => {
    const hit = blocked(x + o.d[0], y + o.d[1]);
    hit ? SFX.caneHit(o.pan, i * .28) : SFX.caneEmpty(o.pan, i * .28);
    return `${o.n} ${hit ? '막힘 ✋' : '비었음'}`;
  });
  caption('🦯 ' + res.join(' · '));
}

    else if (s.speakAfter) speak(s.speakAfter);
    document.getElementById('after').innerHTML = `<div class="fb good">✅ ${s.after}</div><div class="fact" style="margin-top:10px"><b>💡 알고 있었나요?</b>${s.fact}</div>`;
    const b = document.getElementById('fix'); b.textContent = S.s3.fixed.size >= NEED ? '모두 고쳤어요! 🎉' : '계속 찾기';
    announce(s.after);
  });
}

/* ───────────── 마무리 ───────────── */
function finale(){
  mode = 'text'; SFX.good();
  render(`
  <div class="screen">
    <div class="hero" aria-hidden="true">🎉</div>
    <h1 style="text-align:center">미션 완료!</h1>
    <p style="text-align:center">하늘이의 등굣길이 훨씬 편해졌어요.</p>
    <div class="stat">
      <div><b>${S.s1.bumpsA}→${S.s1.bumpsB}</b><span>부딪힘<br>(도구 전→후)</span></div>
      <div><b>${S.s2.firstTry}/${SCENES.length}</b><span>친구 돕기<br>한 번에 정답</span></div>
      <div><b>${S.s3.fixed.size}/${NEED}</b><span>고친 장벽</span></div>
    </div>
    <div class="card">
      <p style="font-weight:700;margin-bottom:6px">오늘 기억할 3가지</p>
      <ul class="take">
        <li>불편함은 장애가 아니라 <b>정보가 없는 환경</b>에서 와요.</li>
        <li>돕기 전에 <b>"도와줄까?"</b> 먼저 묻고, 방향은 <b>구체적으로</b> 말해요.</li>
        <li>점자블록 비우기, 그림 설명 달기 — <b>나도 장벽을 없앨 수 있어요.</b></li>
      </ul>
    </div>
    <div class="spacer"></div>
    ${EMBEDDED ? '<button class="btn" id="done">☕ 주문하러 가기</button>' : '<button class="btn" id="again">처음부터 다시 하기</button><p class="mut" style="text-align:center;font-size:12px">앱 안에서 열면 이 자리에 "주문하러 가기" 버튼이 나타나요.</p>'}
  </div>`);
  on('done', () => { reportComplete(); const b = document.getElementById('done'); b.disabled = true; b.textContent = '주문 화면으로 이동 중…'; });
  on('again', () => { S.s1 = { bumpsA: 0, bumpsB: 0, reachedA: false }; S.s2 = { firstTry: 0 }; S.s3 = { fixed: new Set() }; intro(); });
}

intro();
</script>
